# Music Map: ready to run.
#
#   cp .env.example .env     # then fill in the values (see README → Running with Docker)
#   docker compose up -d --build
#
# With automatic HTTPS from the bundled Caddy (needs ports 80/443 and DNS for your domain):
#   docker compose --profile caddy up -d --build
#
# On Coolify (or behind any proxy on the same Docker network), no host port is needed: point the
# proxy at port 3000 of this service. To publish a host port for a proxy running on the host
# itself, see README → "Your own reverse proxy".
#
# Settings live in .env (or the platform's environment settings), so this file shouldn't need editing.

services:
  music-map:
    build: .
    image: music-map:latest
    restart: unless-stopped
    environment:
      ORIGIN: ${ORIGIN:?Set ORIGIN in .env, e.g. https://music.example.com}
      # Checked by the app at startup (it exits with a clear message if missing), not here, so
      # `docker compose run` can generate the hash before it's set.
      APP_PASSWORD_HASH: ${APP_PASSWORD_HASH:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      MB_USER_AGENT: ${MB_USER_AGENT:-}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      LASTFM_API_KEY: ${LASTFM_API_KEY:-}
    # Reachable on the Docker network only (Caddy, Coolify/Traefik). No host port, so nothing to clash with.
    expose:
      - "3000"
    volumes:
      - music-map-data:/data

  caddy:
    profiles: [caddy]
    image: caddy:2
    restart: unless-stopped
    depends_on: [music-map]
    environment:
      ORIGIN: ${ORIGIN}
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config

configs:
  caddyfile:
    # Caddy gets a certificate for the host in ORIGIN and proxies to the app.
    content: |
      {$$ORIGIN} {
        reverse_proxy music-map:3000
      }

volumes:
  music-map-data:
  caddy-data:
  caddy-config:
