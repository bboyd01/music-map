# Copy to docker-compose.yml and fill in .env (see .env.example).
services:
  music-map:
    build: .
    image: music-map:latest
    restart: unless-stopped
    env_file: .env
    ports:
      # Bind to localhost and put a TLS reverse proxy in front (see README).
      - "127.0.0.1:3000:3000"
    volumes:
      - music-map-data:/data

volumes:
  music-map-data:
